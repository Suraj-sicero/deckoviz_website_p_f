# ==============================================================================
# Deckoviz Backend API Documentation for Mobile App Integration
# Target Audience: Mayur (Mobile App Developer)
# File Path: docs/api_documentation.yaml
# ==============================================================================

info:
  title: Deckoviz Backend API & WebSocket Specification
  description: >
    Complete, production-exact API documentation for integrating the Deckoviz Mobile App
    with the Deckoviz FastAPI backend. All field names, data types, HTTP routes, status codes,
    WebSocket protocol envelopes, and authentication mechanisms are extracted directly from
    the backend codebase.
  version: 1.0.0
  backend_framework: FastAPI (Python 3.10+)
  database: Firebase Firestore & In-Memory State
  base_url: http://localhost:8000
  ws_base_url: ws://localhost:8000

# ==============================================================================
# 5. AUTHENTICATION & SECURITY OVERVIEW
# ==============================================================================
authentication:
  type: HTTP Bearer Token (JWT)
  header_format: "Authorization: Bearer <token>"
  algorithm: HS256
  secret_key_config: settings.SECRET_KEY (default: "deckoviz_super_secret_jwt_key_2026")
  token_expiration: 7 days (10,080 minutes)
  
  jwt_payload_fields:
    uid: string (User ID)
    sub: string (User ID)
    id: string (User ID)
    email: string (User Email)
    name: string (User Display Name)
    app_instance_id: string | null (Included when token is minted during device pairing claim)

  token_sources:
    - endpoint: "POST /api/auth/signup"
      description: "Returns JWT access token and user record upon user registration."
    - endpoint: "POST /api/auth/signin"
      description: "Returns JWT access token upon password or Firebase ID token signin."
    - endpoint: "GET /api/pairing/session/{session_id}"
      description: "Returns JWT access token to TV display device once user claims pairing session."
    - endpoint: "POST /api/pairing/claim"
      description: "Authenticated mobile user claims TV OTP code; server returns claimed device details."

  websocket_authentication:
    mechanism: URL Query Parameter
    browser_mobile_url: "ws://<host>/ws/browser?token=<JWT_TOKEN>"
    tv_device_url: "ws://<host>/ws/tv?token=<JWT_TOKEN>&app_instance_id=<app_instance_id>"
    failure_behavior:
      missing_or_invalid_token: WebSocket connection is rejected and closed with status code 4401 (Unauthorized).
      missing_app_instance_id_for_tv: WebSocket connection is rejected and closed with status code 4400 (Bad Request).

# ==============================================================================
# HTTP ENDPOINTS & ROUTES
# ==============================================================================
paths:

  # ----------------------------------------------------------------------------
  # FEATURE 1: DEVICE CONNECT / PAIRING (OTP-BASED)
  # ----------------------------------------------------------------------------

  /api/pairing/session:
    post:
      summary: Create Pairing Session (Initiated by TV / Display Device)
      description: >
        Called by an un-paired display device (e.g., Google TV app) upon startup.
        Generates a unique 6-digit numeric OTP code, a unique `session_id`, a hardware/app instance ID
        (`app_instance_id`), and a QR code payload URL. The TV displays the OTP code/QR code on screen
        and begins polling GET /api/pairing/session/{session_id}.
      auth_required: false
      request_body:
        content_type: application/json
        schema:
          type: object
          properties:
            device_name:
              type: string
              required: false
              default: "Deckoviz TV"
              description: Friendly display name for the device
            platform:
              type: string
              required: false
              default: "google_tv"
              description: Platform target OS (e.g. google_tv, android_tv, webos)
            pair_page_base_url:
              type: string
              required: false
              default: "http://localhost:5173"
              description: Base website domain for QR pairing URL
      responses:
        "201":
          description: Pairing session created successfully
          schema:
            type: object
            properties:
              session_id:
                type: string
                format: uuid
                description: Unique session UUID for polling status
              code:
                type: string
                pattern: "^[0-9]{6}$"
                description: 6-digit numeric OTP code to render on TV screen
              qr_payload:
                type: string
                description: Full URL formatted for QR code generation (e.g. http://localhost:5173/pair?code=482910)
              app_instance_id:
                type: string
                format: uuid
                description: Persistent hardware/instance UUID assigned to this display device
              expires_at:
                type: string
                format: date-time (ISO 8601 UTC)
                description: Code expiration timestamp (TTL is 10 minutes / 600,000 ms)
        "500":
          description: Server failed to create session
          schema:
            type: object
            properties:
              error:
                type: string
      example:
        request:
          device_name: "Living Room TV"
          platform: "google_tv"
          pair_page_base_url: "https://deckoviz.com"
        response:
          session_id: "8f3b2a1c-9d4e-4f5a-8b6c-7d8e9f0a1b2c"
          code: "482910"
          qr_payload: "https://deckoviz.com/pair?code=482910"
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
          expires_at: "2026-08-12T03:19:23Z"

  /api/pairing/session/{session_id}:
    get:
      summary: Poll Pairing Session Status (Initiated by TV)
      description: >
        Polled continuously by the TV display device (e.g. every 2 seconds). When a user enters the 6-digit
        OTP code on the mobile app, the server marks the session as 'paired' and embeds a signed JWT access token.
        Note: The first GET poll after claim returns status 'paired' with the JWT token. Subsequent polls return
        status 'paired' with token set to null (consumed).
      auth_required: false
      parameters:
        - name: session_id
          in: path
          required: true
          type: string
          description: Session ID returned from POST /api/pairing/session
      responses:
        "200":
          description: Pairing session state
          schemas:
            pending_state:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending]
                expires_at:
                  type: string
                  format: date-time
            paired_initial_state:
              type: object
              properties:
                status:
                  type: string
                  enum: [paired]
                token:
                  type: string
                  description: JWT access token signed by server containing app_instance_id
                app_instance_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                device_name:
                  type: string
            paired_consumed_state:
              type: object
              properties:
                status:
                  type: string
                  enum: [paired]
                app_instance_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                device_name:
                  type: string
            expired_state:
              type: object
              properties:
                status:
                  type: string
                  enum: [expired]
      example:
        request: {}
        response:
          status: "paired"
          token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1aWQiOiJ1c3JfOTQ4MjEiLCJzdWIiOiJ1c3JfOTQ4MjEiLCJhcHBfaW5zdGFuY2VfaWQiOiJjMWY3YTJiOS0zZTRmLTRhNWItNmM3ZC04ZTlmMGExYjJjM2QifQ..."
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
          user_id: "usr_94821"
          device_name: "Living Room TV"

  /api/pairing/claim:
    post:
      summary: Claim OTP Pairing Code (Initiated by Mobile App)
      description: >
        Called by the mobile app (authenticated user) to pair a display device. Mayur's mobile app sends
        the 6-digit OTP code or raw scanned QR payload. The backend validates the code, links the device
        to the user's account, upserts it into the device registry, and broadcasts an updated device list
        to connected browser/mobile WebSocket sessions.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      request_body:
        content_type: application/json
        schema:
          type: object
          properties:
            code:
              type: string
              required: false
              description: 6-digit numeric OTP pairing code (e.g. "482910")
            qr_payload:
              type: string
              required: false
              description: Raw scanned QR code URL containing 6-digit code
            device_name:
              type: string
              required: false
              description: Custom device name override (defaults to session device_name or 'Deckoviz TV')
      responses:
        "200":
          description: Pairing claimed and device registered successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              device:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Registered device record database ID
                  app_instance_id:
                    type: string
                    format: uuid
                    description: Target hardware instance ID required for queue, livestream, and WS calls
                  device_name:
                    type: string
                  platform:
                    type: string
                  status:
                    type: string
                    enum: [offline, online]
                  created:
                    type: boolean
                    description: True if new device record, false if updated existing device
        "400":
          description: Missing or invalid 6-digit code format
          schema:
            type: object
            properties:
              error:
                type: string
                example: "A valid 6-digit code is required"
        "404":
          description: Code not found
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid or expired pairing code"
        "409":
          description: Code already used
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Pairing code already used"
        "410":
          description: Code expired
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Pairing code expired"
      example:
        request:
          code: "482910"
          device_name: "Living Room TV"
        response:
          success: true
          device:
            id: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
            app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
            device_name: "Living Room TV"
            platform: "google_tv"
            status: "offline"
            created: true

  # ----------------------------------------------------------------------------
  # FEATURE 3: LIVE STREAMING
  # ----------------------------------------------------------------------------

  /api/livestream/{app_instance_id}:
    post:
      summary: Stream Artwork Live to Paired Device
      description: >
        Pushes a single artwork live stream frame directly to a paired TV device (`app_instance_id`).
        Constructs and dispatches a WebSocket message with action `display_artwork` to the TV and broadcasts
        it to connected mobile/browser sessions. Returns immediate dispatch confirmation and message ID.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      parameters:
        - name: app_instance_id
          in: path
          required: true
          type: string
          description: Hardware/app instance ID of target paired device
      request_body:
        content_type: application/json
        schema:
          type: object
          properties:
            artwork_id:
              type: string
              required: true
              description: Identifier of artwork to stream
            url:
              type: string
              required: false
              description: Public image URL (defaults to artwork_id if omitted)
            transition:
              type: string
              required: false
              default: "fade"
              description: Transition effect (e.g. fade, slide, zoom)
            duration:
              type: integer
              required: false
              default: 5000
              description: Display duration in milliseconds
      responses:
        "200":
          description: Live stream message dispatched
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              dispatched:
                type: boolean
                description: True if TV was online and WS frame was routed, false if TV offline
              message_id:
                type: string
                format: uuid
                description: Unique WebSocket message UUID created for this live stream dispatch
              mode:
                type: string
                enum: [live_stream]
              target_app_instance_id:
                type: string
                format: uuid
        "403":
          description: Device not found or does not belong to authenticated user
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Device not found or belongs to another user."
      example:
        request:
          artwork_id: "art_starry_night_001"
          url: "https://cdn.deckoviz.app/artworks/starry_night.png"
          transition: "fade"
          duration: 10000
        response:
          success: true
          dispatched: true
          message_id: "e4d3c2b1-a099-8877-6655-4433221100fe"
          mode: "live_stream"
          target_app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"

  # ----------------------------------------------------------------------------
  # FEATURE 4: COLLECTION QUEUE MANAGEMENT
  # ----------------------------------------------------------------------------

  /api/queue/{app_instance_id}:
    get:
      summary: Get Device Collection Queue
      description: >
        Fetches all queued collections for a paired display device. Divides queue into the active top 20
        (auto-played by TV display loop) and remaining collections queued beyond top 20.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      parameters:
        - name: app_instance_id
          in: path
          required: true
          type: string
          description: Hardware/app instance ID of paired device
      responses:
        "200":
          description: Queue retrieved successfully
          schema:
            type: object
            properties:
              app_instance_id:
                type: string
                format: uuid
              total_queued:
                type: integer
                description: Total number of collections in queue
              active_top_20:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
                description: Array of up to 20 active collections currently loaded into TV player
              queued_beyond_20:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
                description: Collections positioned after index 19 in queue
              items:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
                description: Complete list of all queued collections
        "403":
          description: Device not found or forbidden
      example:
        request: {}
        response:
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
          total_queued: 2
          active_top_20:
            - collection_id: "col_impressionism_101"
              name: "Impressionist Masters"
              item_count: 12
              added_at: "2026-08-12T03:00:00Z"
              order_index: 0
            - collection_id: "col_modern_202"
              name: "Modern Art Series"
              item_count: 8
              added_at: "2026-08-12T03:05:00Z"
              order_index: 1
          queued_beyond_20: []
          items:
            - collection_id: "col_impressionism_101"
              name: "Impressionist Masters"
              item_count: 12
              added_at: "2026-08-12T03:00:00Z"
              order_index: 0
            - collection_id: "col_modern_202"
              name: "Modern Art Series"
              item_count: 8
              added_at: "2026-08-12T03:05:00Z"
              order_index: 1

    post:
      summary: Add Collection to Device Queue
      description: >
        Appends a collection to the device queue. If collection already exists in queue, duplicate addition
        is prevented. Automatically dispatches a WebSocket `replace_queue` frame containing the updated active top-20
        collections to the target TV device.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      parameters:
        - name: app_instance_id
          in: path
          required: true
          type: string
      request_body:
        content_type: application/json
        schema:
          type: object
          properties:
            collection_id:
              type: string
              required: true
              description: Unique ID of collection to add
            name:
              type: string
              required: false
              default: "Collection"
              description: Display name of collection
            item_count:
              type: integer
              required: false
              default: 0
              description: Number of items in collection
      responses:
        "201":
          description: Collection added to queue
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              dispatched:
                type: boolean
                description: True if replace_queue WS frame was sent to TV
              total_queued:
                type: integer
              items:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
      example:
        request:
          collection_id: "col_baroque_303"
          name: "Baroque Splendor"
          item_count: 15
        response:
          success: true
          dispatched: true
          total_queued: 3
          items:
            - collection_id: "col_impressionism_101"
              name: "Impressionist Masters"
              item_count: 12
              added_at: "2026-08-12T03:00:00Z"
              order_index: 0
            - collection_id: "col_modern_202"
              name: "Modern Art Series"
              item_count: 8
              added_at: "2026-08-12T03:05:00Z"
              order_index: 1
            - collection_id: "col_baroque_303"
              name: "Baroque Splendor"
              item_count: 15
              added_at: "2026-08-12T03:10:00Z"
              order_index: 2

  /api/queue/{app_instance_id}/reorder:
    patch:
      summary: Reorder Device Collection Queue
      description: >
        Reorders queue items according to an ordered list of `collection_ids`. Unspecified collections are appended
        to the end. Automatically dispatches a WebSocket `replace_queue` frame to the TV device.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      parameters:
        - name: app_instance_id
          in: path
          required: true
          type: string
      request_body:
        content_type: application/json
        schema:
          type: object
          properties:
            collection_ids:
              type: array
              required: true
              items:
                type: string
              description: Ordered list of collection IDs establishing new queue order
      responses:
        "200":
          description: Queue reordered successfully
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              dispatched:
                type: boolean
              total_queued:
                type: integer
              items:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
      example:
        request:
          collection_ids: ["col_baroque_303", "col_impressionism_101", "col_modern_202"]
        response:
          success: true
          dispatched: true
          total_queued: 3
          items:
            - collection_id: "col_baroque_303"
              name: "Baroque Splendor"
              item_count: 15
              added_at: "2026-08-12T03:10:00Z"
              order_index: 0
            - collection_id: "col_impressionism_101"
              name: "Impressionist Masters"
              item_count: 12
              added_at: "2026-08-12T03:00:00Z"
              order_index: 1
            - collection_id: "col_modern_202"
              name: "Modern Art Series"
              item_count: 8
              added_at: "2026-08-12T03:05:00Z"
              order_index: 2

  /api/queue/{app_instance_id}/{collection_id}:
    delete:
      summary: Delete Collection from Device Queue
      description: >
        Removes a specific collection from the device queue and re-indexes remaining collections starting at index 0.
        Automatically dispatches a WebSocket `replace_queue` frame containing the updated active top-20 queue to TV.
      auth_required: true
      headers:
        Authorization: "Bearer <user_jwt_token>"
      parameters:
        - name: app_instance_id
          in: path
          required: true
          type: string
        - name: collection_id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Collection removed from queue
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              dispatched:
                type: boolean
              total_queued:
                type: integer
              items:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
      example:
        request: {}
        response:
          success: true
          dispatched: true
          total_queued: 2
          items:
            - collection_id: "col_baroque_303"
              name: "Baroque Splendor"
              item_count: 15
              added_at: "2026-08-12T03:10:00Z"
              order_index: 0
            - collection_id: "col_modern_202"
              name: "Modern Art Series"
              item_count: 8
              added_at: "2026-08-12T03:05:00Z"
              order_index: 1

# ==============================================================================
# WEBSOCKET PROTOCOL & REAL-TIME ACTIONS (RTCSP)
# ==============================================================================
websocket_protocol:
  name: Real-Time Control & Synchronization Protocol (RTCSP)
  description: >
    Bi-directional JSON messaging protocol over WebSocket.
    Mobile app connects to /ws/browser?token=<JWT_TOKEN>.
    TV display device connects to /ws/tv?token=<JWT_TOKEN>&app_instance_id=<app_instance_id>.

  envelope_structure:
    protocol_version: integer (Required, value is 1)
    message_id: string (Required, UUID v4 identifying message frame)
    timestamp: string (Required, ISO 8601 UTC timestamp)
    action: string (Required, action command name)
    target: object | optional (Optional, target object containing app_instance_id)
    payload: object (Required, payload data dictionary)

  actions:

    # --------------------------------------------------------------------------
    # FEATURE 2: IMAGE SENDING ACTION
    # --------------------------------------------------------------------------
    display_image:
      action_name: display_image
      direction: client -> server -> tv
      when_triggered: >
        Sent by mobile app over WebSocket when user selects a single image to display instantly on TV.
        Server validates target TV connection and forwards frame to TV socket.
      full_payload_schema:
        type: object
        properties:
          url:
            type: string
            required: true
            description: Image URL to display
          image_id:
            type: string
            required: false
            description: Identifier of image
          image_url_or_ref:
            type: string
            required: false
            description: Fallback URL reference
          duration:
            type: integer
            required: false
            default: 5000
            description: Display duration in milliseconds
          transition:
            type: string
            required: false
            default: "fade"
            description: Visual transition effect (e.g. fade)
      client_sending_envelope_example:
        protocol_version: 1
        message_id: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        timestamp: "2026-08-12T03:15:00Z"
        action: "display_image"
        target:
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
        payload:
          url: "https://cdn.deckoviz.app/images/mona_lisa.png"
          image_id: "img_mona_lisa"
          image_url_or_ref: "https://cdn.deckoviz.app/images/mona_lisa.png"
          duration: 5000
          transition: "fade"
      server_ack_to_sender:
        description: Server immediately sends acknowledgement frame back to sender socket.
        envelope:
          protocol_version: 1
          message_id: "<generated_uuid>"
          timestamp: "2026-08-12T03:15:00Z"
          action: "acknowledgement"
          payload:
            reference_message_id: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
            status: "success"

    # --------------------------------------------------------------------------
    # FEATURE 3: LIVE STREAMING ACTION
    # --------------------------------------------------------------------------
    display_artwork:
      action_name: display_artwork
      direction: server -> tv & browser
      when_triggered: >
        Triggered automatically by backend service when POST /api/livestream/{app_instance_id} is called.
      full_payload_schema:
        type: object
        properties:
          artwork_id:
            type: string
            required: true
          url:
            type: string
            required: true
          cdn_url:
            type: string
            required: true
          transition:
            type: string
            default: "fade"
          duration:
            type: integer
            default: 5000
          mode:
            type: string
            enum: [live_stream]
      server_dispatch_envelope_example:
        protocol_version: 1
        message_id: "e4d3c2b1-a099-8877-6655-4433221100fe"
        timestamp: "2026-08-12T03:15:05Z"
        action: "display_artwork"
        target:
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
        payload:
          artwork_id: "art_starry_night_001"
          url: "https://cdn.deckoviz.app/artworks/starry_night.png"
          cdn_url: "https://cdn.deckoviz.app/artworks/starry_night.png"
          transition: "fade"
          duration: 5000
          mode: "live_stream"

    # --------------------------------------------------------------------------
    # FEATURE 4: QUEUE SYNC ACTION
    # --------------------------------------------------------------------------
    replace_queue:
      action_name: replace_queue
      direction: server -> tv
      when_triggered: >
        Dispatched automatically to TV device whenever queue is modified via POST, PATCH, or DELETE /api/queue/{app_instance_id}.
      full_payload_schema:
        type: object
        properties:
          collections:
            type: array
            items:
              $ref: '#/components/schemas/QueueItem'
          total_queued:
            type: integer
          active_count:
            type: integer
      server_dispatch_envelope_example:
        protocol_version: 1
        message_id: "3c2b1a0f-9e8d-7c6b-5a4f-3e2d1c0b9a8f"
        timestamp: "2026-08-12T03:15:10Z"
        action: "replace_queue"
        target:
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
        payload:
          collections:
            - collection_id: "col_impressionism_101"
              name: "Impressionist Masters"
              item_count: 12
              added_at: "2026-08-12T03:00:00Z"
              order_index: 0
          total_queued: 1
          active_count: 1

    # --------------------------------------------------------------------------
    # ACKNOWLEDGEMENT & LATENCY CONFIRMATION
    # --------------------------------------------------------------------------
    acknowledgement:
      action_name: acknowledgement
      direction: tv -> server -> client
      when_triggered: >
        Sent by TV display device upon rendering content. The server broadcasts this frame to mobile/browser
        clients with source: "tv". Mobile app matches payload.reference_message_id to HTTP livestream message_id
        or display_image message_id to confirm rendering success and compute delivery latency.
      full_payload_schema:
        type: object
        properties:
          reference_message_id:
            type: string
            format: uuid
            description: Original command message_id
          status:
            type: string
            enum: [success, failed]
          reason:
            type: string
            required: false
            description: Failure details if status is failed
          source:
            type: string
            enum: [tv]
          app_instance_id:
            type: string
            format: uuid
      broadcast_envelope_example:
        protocol_version: 1
        message_id: "9f8e7d6c-5b4a-3f2e-1d0c-9b8a7f6e5d4c"
        timestamp: "2026-08-12T03:15:12Z"
        action: "acknowledgement"
        payload:
          reference_message_id: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
          status: "success"
          reason: null
          source: "tv"
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"

    # --------------------------------------------------------------------------
    # CONNECTION & DEVICE SYSTEM ACTIONS
    # --------------------------------------------------------------------------
    connected:
      action_name: connected
      direction: server -> client / tv
      when_triggered: Sent immediately upon WebSocket connection acceptance.
      full_payload_schema:
        type: object
        properties:
          client_type:
            type: string
            enum: [browser, tv]
          user_id:
            type: string
          app_instance_id:
            type: string
            nullable: true
          server_time:
            type: string
            format: date-time
      example_envelope:
        protocol_version: 1
        message_id: "1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d"
        timestamp: "2026-08-12T03:15:00Z"
        action: "connected"
        payload:
          client_type: "browser"
          user_id: "usr_94821"
          app_instance_id: null
          server_time: "2026-08-12T03:15:00Z"

    devices_list:
      action_name: devices_list
      direction: server -> browser / mobile client
      when_triggered: Sent on mobile client WS connection or when device pairing status changes.
      full_payload_schema:
        type: object
        properties:
          devices:
            type: array
            items:
              type: object
              properties:
                app_instance_id:
                  type: string
                device_name:
                  type: string
                platform:
                  type: string
                status:
                  type: string
                  enum: [online, offline]
                last_seen:
                  type: string
                current_artwork:
                  type: string
                  nullable: true
                playback_state:
                  type: string
                  nullable: true
      example_envelope:
        protocol_version: 1
        message_id: "2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e"
        timestamp: "2026-08-12T03:15:00Z"
        action: "devices_list"
        payload:
          devices:
            - app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"
              device_name: "Living Room TV"
              platform: "google_tv"
              status: "online"
              last_seen: "2026-08-12T03:15:00Z"
              current_artwork: "art_starry_night_001"
              playback_state: "playing"

    device_offline:
      action_name: device_offline
      direction: server -> browser / mobile client
      when_triggered: Sent when a paired TV device disconnects from WebSocket.
      full_payload_schema:
        type: object
        properties:
          app_instance_id:
            type: string
      example_envelope:
        protocol_version: 1
        message_id: "5e6f7a8b-9c0d-1e2f-3a4b-5c6d7e8f9a0b"
        timestamp: "2026-08-12T03:20:00Z"
        action: "device_offline"
        payload:
          app_instance_id: "c1f7a2b9-3e4f-4a5b-6c7d-8e9f0a1b2c3d"

# ==============================================================================
# COMPONENT REUSABLE SCHEMAS
# ==============================================================================
components:
  schemas:
    QueueItem:
      type: object
      properties:
        collection_id:
          type: string
          description: Unique collection ID
        name:
          type: string
          description: Name or title of queued collection
        item_count:
          type: integer
          description: Total artwork items in collection
        added_at:
          type: string
          format: date-time (ISO 8601 UTC)
          description: Timestamp when collection was added to queue
        order_index:
          type: integer
          description: Zero-based position index in queue
